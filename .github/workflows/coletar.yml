name: Coletar vendas

on:
  schedule:
    - cron: '23 * * * *'   # de hora em hora no minuto 23 (fora dos minutos redondos, em que o GitHub atrasa mais)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Coletar
        env:
          POKEIDLE_NICK: ${{ secrets.POKEIDLE_NICK }}
          POKEIDLE_TOKEN: ${{ secrets.POKEIDLE_TOKEN }}
          NOMES_SAL: ${{ secrets.NOMES_SAL }}
        run: npm run coletar
      - name: Salvar no repositório
        run: |
          git config user.name "coletor"
          git config user.email "coletor@users.noreply.github.com"
          git add docs/dados coletor/estado.json coletor/jogo
          git diff --cached --quiet && exit 0
          git commit -m "Vendas $(date -u +'%Y-%m-%d %H:%M') UTC"
          # em conflito nos dados (alguém mexeu nos mesmos arquivos), fica a versão do coletor
          git pull -q --rebase -X theirs || { git rebase --abort 2>/dev/null; git pull -q --no-rebase -X ours; }
          git push
