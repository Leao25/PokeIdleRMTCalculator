name: Coletar vendas

on:
  schedule:
    - cron: '17 */2 * * *'   # a cada 2 horas, no minuto 17 (fora do pico do início da hora)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Coletar
        env:
          POKEIDLE_NICK: ${{ secrets.POKEIDLE_NICK }}
          POKEIDLE_TOKEN: ${{ secrets.POKEIDLE_TOKEN }}
          NOMES_SAL: ${{ secrets.NOMES_SAL }}
        run: npm run coletar
      - name: Salvar no repositório
        run: |
          git config user.name "coletor"
          git config user.email "coletor@users.noreply.github.com"
          git add docs/dados
          git diff --cached --quiet && exit 0
          git commit -m "Vendas $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
